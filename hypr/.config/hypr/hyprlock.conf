# ==================================================
# Gruvbox Material Configuration for Hyprlock
# ==================================================

# Background configuration (uses current Hyprland wallpaper with heavy blur)
background {
    monitor =
    path = ~/Pictures/Wallpapers/nicesky.webp # or use screenshot
    blur_passes = 3 
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Input-field (Password prompt)
input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    dots_size = 0.33 # Scale of input dots
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    fade_on_empty = false
    
    # Gruvbox Material Color Palette
    outer_color = rgb(50, 43, 41)    # bg2
    inner_color = rgb(40, 35, 33)    # bg0
    font_color = rgb(228, 184, 137)  # fg0
    fail_color = rgb(204, 36, 29)    # bright:red
    
    check_color = rgb(215, 153, 33)  # bright:yellow
    font_family = JetBrainsMono Nerd Font
# Correct syntax with double quotes and double hashtags
placeholder_text = <span foreground='##a89984'><i> >Enter Password...</i></span>
    position = 0, -150
    halign = center
    valign = center
}

# User Profile Avatar (Requires imagemagick installed)
image {
    monitor =
    path = ~/.face # Path to your user profile picture
    size = 120 # Lesser side if not 1:1
    border_size = 3
    border_color = rgb(184, 187, 38) # Gruvbox Material Green
    position = 0, 0
    halign = center
    valign = center
}

# Clock (Date)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%A, %B %d") </big></b>"
    color = rgb(40, 35, 33) # Gruvbox fg0
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Clock (Time)
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>"
    color = rgb(40, 35, 33) # Gruvbox fg0
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}
